<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#1a1430"/>
      <stop offset="100%" stop-color="#08061a"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0cc60"/>
      <stop offset="45%" stop-color="#d4aa3a"/>
      <stop offset="100%" stop-color="#8a6818"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#3d2e70" stroke-width="1.5"/>

  <!-- diamond echoing the menu's title divider glyph -->
  <g transform="translate(32,33)">
    <path d="M0,-19 L7,0 L0,19 L-7,0 Z" fill="url(#gold)" opacity="0.16"/>

    <!-- arrow -->
    <g stroke="url(#gold)" stroke-width="3.4" stroke-linecap="round" fill="none">
      <line x1="-15" y1="14" x2="14" y2="-15"/>
    </g>
    <path d="M14,-15 L14,-6 M14,-15 L5,-15" stroke="url(#gold)" stroke-width="3.4" stroke-linecap="round" fill="none"/>
    <path d="M-15,14 L-9,14 L-9,8" stroke="url(#gold)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85"/>
  </g>
</svg>
